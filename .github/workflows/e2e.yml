name: E2E (QA)

# The Playwright suite (e2e/) against QA. docs/testing-rules.md T3.
#
#   - push to qa: after every merge, against that commit's own deployment.
#     Docs-only pushes (handoffs, dispatches) are skipped.
#   - nightly: catches drift on days with no merges. GitHub only runs
#     `schedule` from the repository's default branch.
#   - workflow_dispatch: "run it now" from the Actions tab.
#
# A pull request's head is tested by e2e-preview.yml, against its preview.
#
# Check-run name: e2e-qa (the job id below). Keep it stable.
on:
  push:
    branches: [qa]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    # Off the top of the hour: GitHub delays or DROPS scheduled runs under
    # load, worst at :00 (the 02:00 slot never fired on 4 Oct). A second,
    # later slot is the backup; the shared queue serialises them.
    - cron: "23 1 * * *" # 01:23 UTC = 06:53 IST
    - cron: "41 4 * * *" # 04:41 UTC = 10:11 IST (backup)
  workflow_dispatch: {}

# One run per ref. A newer push makes the older run pointless, so it is
# cancelled; the nightly is never cancelled and never cancels anything.
# ONE queue for every e2e run (e2e.yml and e2e-preview.yml share it): all runs
# use the same QA database fixtures (waitlist/wallet event, design tokens), so
# two runs at once corrupt each other (3 Oct: #725's QA run and PR #726's preview
# run both failed waitlist-wallet-credit while overlapping). Runs wait, never cancel
# a running one. GitHub keeps only the NEWEST pending run per group, so if three
# queue up the middle one is cancelled: chat re-runs it before merging (T2).
concurrency:
  group: e2e-qa-shared-fixtures
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  e2e-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium only - matches playwright.config.ts projects)
        run: npx playwright install --with-deps chromium

      # A push to qa starts this job while Vercel is still building that
      # commit, and the QA alias keeps serving the previous build until it is
      # done. Wait for this commit's own deployment and test its URL.
      - name: Wait for this commit's deployment (push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node e2e/ci-wait-for-deployment.mjs "${{ github.repository }}" "${{ github.sha }}"

      # Small chunks (Hitesh, 11 Oct 2026): the suite outgrew one 30-min job
      # (10 Oct: two nightlies and a PR run killed at 30m with no report).
      # Six shards run one after another in this job - never in parallel,
      # the QA fixtures are shared - each with its own 15-min limit, and a
      # failed or timed-out shard does not stop the next. Test timeouts are
      # unchanged; only the job envelope grew (6 x 15 + setup).
      - name: e2e shard 1/6
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npx playwright test --shard=1/6
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_JSON_OUT: e2e-results/shard-1.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/shard-1

      - name: e2e shard 2/6
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npx playwright test --shard=2/6
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_JSON_OUT: e2e-results/shard-2.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/shard-2

      - name: e2e shard 3/6
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npx playwright test --shard=3/6
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_JSON_OUT: e2e-results/shard-3.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/shard-3

      - name: e2e shard 4/6
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npx playwright test --shard=4/6
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_JSON_OUT: e2e-results/shard-4.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/shard-4

      - name: e2e shard 5/6
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npx playwright test --shard=5/6
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_JSON_OUT: e2e-results/shard-5.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/shard-5

      - name: e2e shard 6/6
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npx playwright test --shard=6/6
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_JSON_OUT: e2e-results/shard-6.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/shard-6

      - name: Summary annotation (pass/fail counts, all shards)
        if: always()
        env:
          E2E_SUMMARY_LABEL: e2e-qa
        run: node e2e/ci-summary.mjs e2e-results/shard-1.json e2e-results/shard-2.json e2e-results/shard-3.json e2e-results/shard-4.json e2e-results/shard-5.json e2e-results/shard-6.json

      - name: Upload Playwright report and shard results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-results/
          retention-days: 14

      - name: Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
