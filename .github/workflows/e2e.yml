name: E2E (QA)

# The Playwright suite (e2e/) against QA. docs/testing-rules.md T3.
#
#   - push to qa: after every merge, against that commit's own deployment.
#     Docs-only pushes (handoffs, dispatches) are skipped.
#   - nightly: catches drift on days with no merges. GitHub only runs
#     `schedule` from the repository's default branch.
#   - workflow_dispatch: "run it now" from the Actions tab.
#
# A pull request's head is tested by e2e-preview.yml, against its preview.
#
# Check-run name: e2e-qa (the job id below). Keep it stable.
on:
  push:
    branches: [qa]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 07:30 IST
  workflow_dispatch: {}

# One run per ref. A newer push makes the older run pointless, so it is
# cancelled; the nightly is never cancelled and never cancels anything.
concurrency:
  group: e2e-qa-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  deployments: read

jobs:
  e2e-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium only - matches playwright.config.ts projects)
        run: npx playwright install --with-deps chromium

      # A push to qa starts this job while Vercel is still building that
      # commit, and the QA alias keeps serving the previous build until it is
      # done. Wait for this commit's own deployment and test its URL.
      - name: Wait for this commit's deployment (push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node e2e/ci-wait-for-deployment.mjs "${{ github.repository }}" "${{ github.sha }}"

      - name: Run e2e suite
        run: npx playwright test
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - name: Summary annotation (pass/fail counts)
        if: always()
        env:
          E2E_SUMMARY_LABEL: e2e-qa
        run: node e2e/ci-summary.mjs

      - name: Upload Playwright report and results.json
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/results.json
          retention-days: 14

      - name: Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
