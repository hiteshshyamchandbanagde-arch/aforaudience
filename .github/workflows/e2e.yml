name: E2E Tests (Playwright)

# Runs the existing e2e/*.spec.ts suite against the live QA deployment
# (same default baseURL as playwright.config.ts) with no extra setup needed.
#
# Triggers:
#   - push to qa: catches regressions from every merge, mirrors how Hitesh
#     tests live on QA right after each deploy
#   - nightly schedule: catches drift/regressions even on days with no merges
#   - workflow_dispatch: manual "run it now" button from the Actions tab
#
# concurrency: QA is a single shared environment/DB (see playwright.config.ts
# comments - fullyParallel:false, workers:1 for the same reason), so two CI
# runs racing bookings against each other would be worse than one queued run
# waiting. group-based concurrency without cancel-in-progress queues instead
# of overlapping.
on:
  push:
    branches: [qa]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly = 7:30 AM IST
  workflow_dispatch: {}

concurrency:
  group: e2e-qa
  cancel-in-progress: false

# Newer GitHub default token-permission policy scopes the automatic
# GITHUB_TOKEN to read-only unless a workflow explicitly requests more -
# the "Post results as a commit comment" step needs contents:write to
# succeed (25 Jul: without this, the curl call "succeeded" as a shell
# step - exit code 0 - while the API call itself silently 403'd, since
# the step didn't check the HTTP response status).
permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium only - matches playwright.config.ts projects)
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite against live QA
        run: npx playwright test
        env:
          CI: true

      # GitHub's job-log and artifact download endpoints both redirect to
      # Azure blob storage (blob.core.windows.net), which isn't on Claude's
      # sandbox network allowlist - so a failure here was previously
      # invisible to Claude beyond "exit code 1", even though the run
      # itself succeeded or failed correctly. Posting a plain-text summary
      # as a commit comment keeps the result entirely on api.github.com,
      # which Claude can already read.
      - name: Summarize results
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          let data;
          try { data = JSON.parse(fs.readFileSync("results.json", "utf8")); }
          catch (e) { fs.writeFileSync("summary.md", "Could not read results.json: " + e.message); process.exit(0); }

          const rows = [];
          function walk(suite) {
            for (const s of suite.suites || []) walk(s);
            for (const spec of suite.specs || []) {
              for (const t of spec.tests || []) {
                for (const r of t.results || []) {
                  rows.push({
                    file: spec.file,
                    title: spec.title,
                    project: t.projectName,
                    status: r.status,
                    error: r.error ? (r.error.message || "").split("\n")[0] : "",
                  });
                }
              }
            }
          }
          for (const s of data.suites || []) walk(s);

          const passed = rows.filter(r => r.status === "passed").length;
          const failed = rows.filter(r => r.status !== "passed");
          let md = `### E2E run — ${passed}/${rows.length} passed\n\n`;
          if (failed.length) {
            md += "**Failures:**\n\n";
            for (const r of failed) {
              md += `- \`${r.file}\` — ${r.title} (${r.project}): **${r.status}**${r.error ? " — " + r.error : ""}\n`;
            }
          } else {
            md += "All tests passed.\n";
          }
          md += "\n<details><summary>All results</summary>\n\n";
          for (const r of rows) {
            md += `- ${r.status === "passed" ? "✅" : "❌"} \`${r.file}\` — ${r.title} (${r.project})\n`;
          }
          md += "\n</details>\n";
          fs.writeFileSync("summary.md", md);
          console.log(md);
          '

      - name: Post results as a commit comment
        if: always()
        run: |
          BODY=$(node -e 'console.log(JSON.stringify(require("fs").readFileSync("summary.md","utf8")))')
          curl -sf -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "{\"body\": $BODY}"

      - name: Upload Playwright report (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
