name: E2E (preview)

# The per-PR gate (docs/testing-rules.md T2/T3): the Playwright suite against
# a commit's own Vercel preview. Vercel's GitHub integration posts a
# deployment_status when a deployment finishes; this runs on the successful,
# non-production ones, with PLAYWRIGHT_BASE_URL set to that deployment.
#
# Check-run name: e2e-preview (the job id below), on the deployed commit.
# Chat requires it on the pinned head before merging. Keep it stable.
#
# Previews share the QA database, so this is QA data, never production.
on:
  deployment_status:

# A deployment_status carries no branch, only the commit, so the group is
# per commit: re-deploys of the same commit replace each other.
concurrency:
  group: e2e-preview-${{ github.event.deployment.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-preview:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production' &&
      !startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}

      # The qa branch's own deployments are "Preview" to Vercel too. Those
      # are tested by e2e.yml (push to qa); running both would put two
      # suites on the shared fixtures at once.
      - name: Is this the tip of qa?
        id: target
        run: |
          qa_tip="$(git ls-remote origin refs/heads/qa | cut -f1)"
          if [ "$qa_tip" = "${{ github.event.deployment.sha }}" ]; then
            echo "::notice title=e2e-preview::This commit is the tip of qa - covered by the e2e-qa check; nothing run here."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Testing $PLAYWRIGHT_BASE_URL"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.target.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.target.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright browser (chromium only - matches playwright.config.ts projects)
        if: steps.target.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite against the preview
        if: steps.target.outputs.run == 'true'
        run: npx playwright test
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - name: Summary annotation (pass/fail counts)
        if: always() && steps.target.outputs.run == 'true'
        env:
          E2E_SUMMARY_LABEL: e2e-preview
        run: node e2e/ci-summary.mjs

      - name: Upload Playwright report and results.json
        if: always() && steps.target.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/results.json
          retention-days: 14

      - name: Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
