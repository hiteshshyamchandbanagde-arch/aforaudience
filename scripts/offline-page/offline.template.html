<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — AforAudience</title>
  <link rel="icon" href="/icon-192x192.png" type="image/png" />
  <meta name="theme-color" content="{{THEME_COLOR}}" />
  <!--
    BUG-2610-024 - GENERATED by scripts/build-offline-page.js from
    scripts/offline-page/offline.template.html. Edit the template, then run
    `node scripts/build-offline-page.js` (prebuild runs it too).

    The service worker serves this page straight from its cache when a
    navigation fails with no signal, so nothing here may need the network:
    the design tokens below are copied from src/app/globals.css at build
    time, and the two AFA fonts are embedded. Admin edits to tokens made
    after the build don't reach this page (it is never rendered by Next).
    English only: this static page has no locale of its own.
  -->
  <style>
{{FONT_FACES}}
    :root {
{{TOKENS}}
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--afa-surface-page);
      color: var(--afa-text-primary);
      font-family: "AFA Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--afa-space-6);
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin-bottom: var(--afa-space-6);
      border-radius: var(--afa-radius-lg);
      background: var(--afa-surface-raised);
      border: 1px solid var(--afa-tint-08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark svg { display: block; }
    h1 {
      font-family: "AFA Display", Georgia, serif;
      font-size: var(--afa-text-page-title);
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 var(--afa-space-3);
      max-width: 20ch;
    }
    p {
      font-size: var(--afa-text-title);
      line-height: 1.5;
      color: var(--afa-text-secondary);
      max-width: 36ch;
      margin: 0 0 var(--afa-space-6);
    }
    button {
      font-family: inherit;
      background: var(--afa-fill-solid);
      color: var(--afa-on-fill-solid);
      border: none;
      border-radius: var(--afa-radius-pill);
      padding: var(--afa-space-3) var(--afa-space-28px);
      font-size: var(--afa-text-title);
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--afa-amber); outline-offset: 3px; }
    .tip {
      margin-top: var(--afa-space-32px);
      margin-bottom: 0;
      font-size: var(--afa-text-body);
      color: var(--afa-text-muted);
      max-width: 32ch;
    }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">
    <!-- The app icon's three bars (src/app/icon.svg); logo colours stay fixed. -->
    <svg width="44" height="44" viewBox="0 0 64 64">
      <path d="M18 18h28v8H18z" fill="#C8441A"/>
      <path d="M18 30h20v8H18z" fill="#C9973A"/>
      <path d="M18 42h14v8H18z" fill="#F7F3EE"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>No signal right now — but any tickets you've already opened are still saved for the door.</p>
  <button onclick="location.reload()">Try again</button>
  <p class="tip">Tip: open your tickets from the "My Tickets" screen — they'll show even without a connection once you've viewed them once.</p>
</body>
</html>
